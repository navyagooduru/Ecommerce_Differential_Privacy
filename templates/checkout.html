<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopSmart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .checkout-container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #111;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #111;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2864e6;
        }

        .payment-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .payment-option input {
            width: auto;
            margin: 0;
        }

        .place-order-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #2864e6;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .place-order-btn:hover {
            background: #1f54c7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2864e6;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="checkout-container">

        <h1>Checkout</h1>

        <p class="subtitle">
            Enter your delivery details and choose a payment method
        </p>

        <form action="{{ url_for('place_order') }}" method="POST">

            <!-- Delivery Address -->
            <label for="address">Delivery Address</label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your full delivery address"
                required
            ></textarea>


            <!-- City -->
            <label for="city">City</label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >


            <!-- PIN Code -->
            <label for="pincode">PIN Code</label>

            <input
                type="text"
                id="pincode"
                name="pincode"
                placeholder="Enter your PIN code"
                maxlength="6"
                required
            >


            <!-- Payment -->
            <div class="payment-title">
                Payment Method
            </div>

            <div class="payment-option">
                <input
                    type="radio"
                    id="upi"
                    name="payment_method"
                    value="UPI"
                    required
                >

                <label for="upi">UPI</label>
            </div>

            <div class="payment-option">
                <input
                    type="radio"
                    id="cod"
                    name="payment_method"
                    value="Cash on Delivery"
                >

                <label for="cod">Cash on Delivery</label>
            </div>


            <!-- Place Order -->
            <button type="submit" class="place-order-btn">
                Place Order
            </button>

        </form>

        <a href="{{ url_for('cart') }}" class="back-link">
            ← Back to Cart
        </a>

    </div>

</body>
</html>
