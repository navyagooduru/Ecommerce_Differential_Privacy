<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Placed - ShopSmart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .success-container {
            width: 480px;
            background: white;
            padding: 45px 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 2;
        }

        .check-circle {
            width: 90px;
            height: 90px;
            background: #28a745;
            color: white;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .success-message {
            color: #666;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .order-id {
            background: #f1f3f6;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .orders-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #2864e6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            margin-right: 8px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #eeeeee;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        /* Celebration confetti */

        .confetti {
            position: absolute;
            width: 10px;
            height: 18px;
            top: -30px;
            animation: fall 3s linear infinite;
        }

        .c1 { left: 10%; animation-delay: 0s; }
        .c2 { left: 20%; animation-delay: 0.5s; }
        .c3 { left: 30%; animation-delay: 1s; }
        .c4 { left: 40%; animation-delay: 0.3s; }
        .c5 { left: 50%; animation-delay: 0.8s; }
        .c6 { left: 60%; animation-delay: 1.2s; }
        .c7 { left: 70%; animation-delay: 0.4s; }
        .c8 { left: 80%; animation-delay: 0.9s; }
        .c9 { left: 90%; animation-delay: 0.2s; }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Celebration Confetti -->

    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
    <div class="confetti c7"></div>
    <div class="confetti c8"></div>
    <div class="confetti c9"></div>


    <div class="success-container">

        <div class="check-circle">
            ✓
        </div>

        <h1>Order Placed Successfully!</h1>

        <p class="success-message">
            Thank you for shopping with ShopSmart.
            Your order has been confirmed.
        </p>

        <div class="order-id">
            Order ID: #{{ order_id }}
        </div>

        <a href="{{ url_for('orders') }}" class="orders-btn">
            View My Orders
        </a>

        <a href="{{ url_for('home') }}" class="home-btn">
            Continue Shopping
        </a>

    </div>

</body>
</html>
